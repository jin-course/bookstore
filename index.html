<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notizblock</title>

    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/note.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body onload="init()">

    <div class="main-container">
        <h1>Notizblock</h1>

        <!-- 노트 입력 영역 -->
        <div class="inputbox">
            <p>title:</p>
            <input id="note_input_title" type="text">

            <p>content:</p>
            <input id="note_input" type="text">

            <!-- [신규] 카테고리 선택 -->
            <p>category:</p>
            <select id="note_input_category" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #333; color: white;">
                <option value="일상">일상</option>
                <option value="공부">공부</option>
                <option value="쇼핑">쇼핑</option>
            </select>

            <button onclick="addNote()" style="margin-top: 15px;">Notiz speichern</button>
        </div>

        <!-- 검색 및 카테고리 필터 영역 -->
        <div class="search-box" style="margin: 0 auto 20px auto; width: 300px; display: flex; flex-direction: column; gap: 8px;">
            <input id="search_input" type="text" placeholder="노트 검색..." oninput="filterNotes()" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; box-sizing: border-box;">
            
            <!-- [신규] 카테고리 필터 -->
            <select id="category_filter" onchange="filterNotes()" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #212121; color: white;">
                <option value="all">전체 카테고리 보기</option>
                <option value="일상">일상</option>
                <option value="공부">공부</option>
                <option value="쇼핑">쇼핑</option>
            </select>
        </div>

        <h2>notes</h2>
        <div id="content"></div>

        <h2>archiv</h2>
        <div id="archiv_content"></div>

        <h2>trash</h2>
        <div id="trash_content"></div>
    </div>

    <script src="./scripts/template.js"></script>
    <script src="./script.js"></script>
</body>
</html>
